
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEER AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;text-align:center;background:#111a30;border-bottom:1px solid #263653}
header h1{margin:0;color:#55d9ff;letter-spacing:3px}
header p{color:#aabbd4;margin:7px 0 0}
main{max-width:700px;margin:auto;padding:18px}
#chat{height:55vh;min-height:280px;overflow-y:auto;background:#111a2c;border:1px solid #263653;border-radius:15px;padding:14px}
.msg{padding:12px 14px;margin:10px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#1b2b45}
.user{background:#174b67;margin-left:35px}
.controls{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;padding:14px;border-radius:10px;border:1px solid #344766;background:#111a2c;color:white;font-size:16px}
button{padding:12px 15px;border:0;border-radius:10px;background:#21b9e8;color:#06121d;font-weight:bold}
button:disabled{opacity:.5}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools button{background:#263653;color:white}
#status{color:#aabbd4;font-size:13px;padding:10px 2px}
</style>
</head>
<body>
<header>
<h1>VEER AI</h1>
<p>तुम्हारा हिंदी AI असिस्टेंट</p>
</header>
<main>
<div id="chat">
<div class="msg bot">नमस्ते भाई! मैं VEER AI हूँ। 😊<br>मुझसे कुछ भी पूछो।</div>
</div>
<div id="status">तैयार हूँ। अपना सवाल लिखो।</div>
<div class="controls">
<input id="question" placeholder="यहाँ सवाल लिखो..." autocomplete="off">
<button id="send">भेजो</button>
</div>
<div class="tools">
<button id="mic">🎙️ बोलकर पूछो</button>
<button id="speak">🔊 जवाब सुनना: चालू</button>
<button id="clear">🗑️ चैट साफ़ करो</button>
</div>
</main>
<script>
const chat=document.getElementById("chat");
const question=document.getElementById("question");
const statusText=document.getElementById("status");
let speakOn=true;

function addMessage(text,who){
 const el=document.createElement("div");
 el.className="msg "+who;
 el.textContent=text;
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
 return el;
}

function speak(text){
 if(!speakOn || !("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="hi-IN";
 speechSynthesis.speak(utterance);
}

async function sendMessage(){
 const text=question.value.trim();
 if(!text)return;
 question.value="";
 addMessage(text,"user");
 const waiting=addMessage("जवाब सोच रहा हूँ...","bot");
 statusText.textContent="VEER AI से संपर्क हो रहा है...";
 document.getElementById("send").disabled=true;

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:text})
  });
  const data=await response.json();
  if(!response.ok) throw new Error(data.error||"सर्वर में समस्या है");
  const answer=data.reply||data.response||data.result||"जवाब नहीं मिला।";
  waiting.textContent=answer;
  statusText.textContent="जवाब मिल गया।";
  speak(answer);
 }catch(error){
  waiting.textContent="भाई, अभी AI सर्वर से जवाब नहीं मिला। इंटरनेट चेक करो और Cloudflare Worker की सेटिंग जाँचो।";
  statusText.textContent="कनेक्शन की समस्या।";
 }finally{
  document.getElementById("send").disabled=false;
 }
}

document.getElementById("send").addEventListener("click",sendMessage);
question.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

document.getElementById("speak").addEventListener("click",()=>{
 speakOn=!speakOn;
 document.getElementById("speak").textContent="🔊 जवाब सुनना: "+(speakOn?"चालू":"बंद");
 if(!speakOn && "speechSynthesis" in window)speechSynthesis.cancel();
});

document.getElementById("clear").addEventListener("click",()=>{
 chat.replaceChildren();
 addMessage("चैट साफ़ हो गई भाई! 😊","bot");
});

document.getElementById("mic").addEventListener("click",()=>{
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Recognition){
  statusText.textContent="इस ब्राउज़र में voice input उपलब्ध नहीं है। Chrome में कोशिश करो।";
  return;
 }
 const recognition=new Recognition();
 recognition.lang="hi-IN";
 recognition.onstart=()=>statusText.textContent="सुन रहा हूँ, बोलो...";
 recognition.onresult=e=>{
  question.value=e.results[0][0].transcript;
  sendMessage();
 };
 recognition.onerror=()=>statusText.textContent="आवाज़ नहीं समझ आई। दोबारा कोशिश करो।";
 recognition.start();
});
</script>
</body>
</html>
